<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertTracker — Certification Study Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-icon">📚</span>
        <span class="brand-name">CertTracker</span>
      </div>
    </div>
    <div class="header-right">
      <span class="streak-pill" id="header-streak-pill">🔥 0 Day Streak</span>
      <button class="btn btn-secondary btn-header" id="btn-global-log-session">+ Log Session</button>
      <button class="btn btn-secondary btn-header" id="btn-global-create-goal">+ New Goal</button>
      <button class="btn-icon" id="btn-data-sync" title="Data Sync &amp; Export">💾</button>
      <button class="btn-icon btn-theme" id="theme-toggle-btn" title="Toggle theme">☀️ Light</button>
      <button class="user-btn" id="auth-action-btn"><span>🔑 Log In</span></button>
    </div>
  </header>

  <nav class="main-nav">
    <button class="nav-tab active" data-tab="dashboard"><span class="tab-icon">🏠</span> Dashboard</button>
    <button class="nav-tab" data-tab="goals"><span class="tab-icon">🎯</span> Goals</button>
    <button class="nav-tab" data-tab="sessions"><span class="tab-icon">📝</span> Sessions</button>
    <button class="nav-tab" data-tab="quiz"><span class="tab-icon">🧠</span> Quiz</button>
    <button class="nav-tab" data-tab="calendar"><span class="tab-icon">📅</span> Calendar</button>
    <button class="nav-tab" data-tab="sprint-hub"><span class="tab-icon">🚀</span> Sprint Hub</button>
    <button class="nav-tab" data-tab="community"><span class="tab-icon">👥</span> Community</button>
    <button class="nav-tab" data-tab="admin"><span class="tab-icon">🛠️</span> Admin</button>
  </nav>

  <main class="app-main">

    <!-- DASHBOARD -->
    <section class="tab-view" id="view-dashboard">
      <div id="dashboard-reminders" class="dashboard-reminders"></div>
      <div id="dashboard-kpis" class="kpi-grid"></div>

      <div class="section-heading-row">
        <h2>Active Certification Goals</h2>
      </div>
      <div id="dashboard-goals-container" class="goals-grid"></div>

      <div id="dashboard-benchmark" class="mt-3"></div>
      <div id="dashboard-suggested-resources" class="mt-3"></div>
    </section>

    <!-- GOALS -->
    <section class="tab-view" id="view-goals">
      <div class="view-header-row">
        <div>
          <h2>Certification Goals</h2>
          <p class="text-muted">Create, edit, and track every certification you're working toward.</p>
        </div>
        <button class="btn btn-primary" id="btn-view-add-goal">+ Create Certification Goal</button>
      </div>
      <div id="goals-list-container" class="goals-grid"></div>
    </section>

    <!-- SESSIONS -->
    <section class="tab-view" id="view-sessions">
      <div id="sessions-container"></div>
    </section>

    <!-- QUIZ -->
    <section class="tab-view" id="view-quiz">
      <div id="quiz-container"></div>
    </section>

    <!-- CALENDAR -->
    <section class="tab-view" id="view-calendar">
      <div class="card calendar-card">
        <div id="calendar-container"></div>
      </div>
    </section>

    <!-- SPRINT HUB -->
    <section class="tab-view" id="view-sprint-hub">
      <div id="sprint-hub-container"></div>
    </section>

    <!-- COMMUNITY -->
    <section class="tab-view" id="view-community">
      <div id="community-container"></div>
    </section>

    <!-- ADMIN -->
    <section class="tab-view" id="view-admin">
      <div id="admin-container"></div>
    </section>

  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Wire up static header/goal buttons that live outside the JS-rendered containers
    document.getElementById('btn-view-add-goal')?.addEventListener('click', () => {
      window.certTrackerApp?.openCreateGoalModal();
    });
  </script>
</body>
</html>
