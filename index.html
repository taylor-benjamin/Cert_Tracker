<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertTracker — Certification Study Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell" id="app-shell">

    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5-10 4.5-10-4.5Z"/><path d="M6.5 11.7v4.3c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5v-4.3"/><path d="M21 9.5v6"/></svg></span>
        <span class="brand-name nav-label">CertTracker</span>
      </div>

      <nav class="main-nav">
        <button class="nav-tab active" data-tab="dashboard" title="Dashboard"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg></span><span class="nav-label">Dashboard</span></button>

        <div class="nav-divider"></div>

        <button class="nav-tab" data-tab="goals" title="Goals"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg></span><span class="nav-label">Goals</span></button>
        <button class="nav-tab" data-tab="sessions" title="Sessions"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 16.5h6"/></svg></span><span class="nav-label">Sessions</span></button>
        <button class="nav-tab" data-tab="quiz" title="Quiz"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0-1.7 4.3A2.7 2.7 0 0 0 6 16.5 2.5 2.5 0 0 0 8.5 19c.3 0 .6 0 .9-.1"/><path d="M15 4.5a2.5 2.5 0 0 1 2.5 2.5 2.5 2.5 0 0 1 1.7 4.3A2.7 2.7 0 0 1 18 16.5a2.5 2.5 0 0 1-2.5 2.5c-.3 0-.6 0-.9-.1"/><path d="M9 4.5c1.7-.3 3.3-.3 5 0M9.4 18.9c1.1.3 2.1.3 3.2 0M6.7 8.3c.6.5 1.4.8 2.3.9M17.3 8.3c-.6.5-1.4.8-2.3.9M6 16.5c.7.2 1.4.2 2.1.1M18 16.5c-.7.2-1.4.2-2.1.1M9 4.5v14M15 4.5v14"/></svg></span><span class="nav-label">Quiz</span></button>
        <button class="nav-tab" data-tab="calendar" title="Calendar"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span><span class="nav-label">Calendar</span></button>

        <div class="nav-divider"></div>

        <button class="nav-tab" data-tab="community" title="Community"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.9-5 5.5-5s4.9 1.7 5.5 5"/><path d="M15.5 5.5a3.2 3.2 0 0 1 0 6.3M20.5 19c-.4-2.3-1.6-3.8-3.3-4.6"/></svg></span><span class="nav-label">Community</span></button>
        <button class="nav-tab" data-tab="admin" title="Admin"><span class="tab-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.4-2-3.4-2.2.7a7.7 7.7 0 0 0-2.6-1.5L14 2h-4l-.5 2.9a7.7 7.7 0 0 0-2.6 1.5l-2.2-.7-2 3.4L4.6 10.5a7.6 7.6 0 0 0 0 3L2.7 15l2 3.4 2.2-.7c.8.7 1.6 1.2 2.6 1.5L10 22h4l.5-2.9a7.7 7.7 0 0 0 2.6-1.5l2.2.7 2-3.4-1.9-1.4Z"/></svg></span><span class="nav-label">Admin</span></button>
      </nav>

      <div class="sidebar-footer">
        <span class="streak-pill" id="header-streak-pill">🔥 0 Day Streak</span>
        <button class="sidebar-collapse-btn" id="btn-sidebar-collapse" title="Collapse sidebar">
          <span class="collapse-arrow">«</span><span class="nav-label">Collapse sidebar</span>
        </button>
      </div>
    </aside>

    <div class="app-content">

      <header class="app-header">
        <div class="header-left"></div>
        <div class="header-right">
          <div class="dropdown">
            <button class="btn btn-primary btn-header" id="btn-header-add" title="Add">+ Add ▾</button>
            <div class="dropdown-menu">
              <button class="dropdown-item" id="btn-global-log-session"><svg class="icon icon-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 16.5h6"/></svg> Log Session</button>
              <button class="dropdown-item" id="btn-global-create-goal"><svg class="icon icon-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg> New Goal</button>
            </div>
          </div>

          <div class="icon-toolbar">
            <button class="btn-icon" id="btn-notifications" title="Push Notification Reminders"><svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>
            <button class="btn-icon" id="btn-data-sync" title="Data Sync &amp; Export"><svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg></button>
            <button class="btn-icon btn-theme" id="theme-toggle-btn" title="Toggle theme"><svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg></button>
          </div>

          <button class="user-btn" id="auth-action-btn"><svg class="icon icon-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="M15 16l4-4-4-4M19 12H9"/></svg> <span>Log In</span></button>
        </div>
      </header>

      <main class="app-main">

    <!-- DASHBOARD -->
    <section class="tab-view" id="view-dashboard">
      <div id="dashboard-reminders" class="dashboard-reminders"></div>
      <div id="dashboard-kpis" class="kpi-grid"></div>

      <div class="section-heading-row">
        <h2>Active Certification Goals</h2>
      </div>
      <div id="dashboard-goals-container" class="goals-grid"></div>

      <div id="dashboard-timeline" class="mt-3"></div>
      <div id="dashboard-benchmark" class="mt-3"></div>
      <div id="dashboard-suggested-resources" class="mt-3"></div>
    </section>

    <!-- GOALS -->
    <section class="tab-view" id="view-goals">
      <div class="view-header-row">
        <div>
          <h2>Certification Goals</h2>
          <p class="text-muted">Create, edit, and track every certification you're working toward.</p>
        </div>
        <button class="btn btn-primary" id="btn-view-add-goal">+ Create Certification Goal</button>
      </div>
      <div id="goals-list-container" class="goals-grid"></div>
    </section>

    <!-- SESSIONS -->
    <section class="tab-view" id="view-sessions">
      <div id="sessions-container"></div>
    </section>

    <!-- QUIZ -->
    <section class="tab-view" id="view-quiz">
      <div id="quiz-container"></div>
    </section>

    <!-- CALENDAR -->
    <section class="tab-view" id="view-calendar">
      <div class="card calendar-card">
        <div id="calendar-container"></div>
      </div>
    </section>

    <!-- COMMUNITY -->
    <section class="tab-view" id="view-community">
      <div id="community-container"></div>
    </section>

    <!-- ADMIN -->
    <section class="tab-view" id="view-admin">
      <div id="admin-container"></div>
    </section>

      </main>

    </div>

  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Wire up static header/goal buttons that live outside the JS-rendered containers
    document.getElementById('btn-view-add-goal')?.addEventListener('click', () => {
      window.certTrackerApp?.openCreateGoalModal();
    });
  </script>
</body>
</html>
